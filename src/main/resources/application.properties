spring.application.name=bn-ms-java-picking-despacho
server.port=8084

# Base de datos H2 en memoria (consola web en /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:h2:mem:pickingdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# URL de los otros microservicios con los que se comunica este servicio
servicios.ordenes.url=http://localhost:8083
servicios.inventario.url=http://localhost:8082